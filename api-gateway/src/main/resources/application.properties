spring.application.name=api-gateway

server.port=9000
#
spring.cloud.gateway.server.webmvc.routes[0].id=product-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=order-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webmvc.routes[2].id=demo-app-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://demoapp
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/demo/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**

eureka.client.service-url.default-zone=http://localhost:8761/eureka/

logging.level.org.springframework.cloud.gateway=DEBUG

jwt.secret=${JWT_SECRET:default_very_long_secret_key_change_me_in_config_server}

# -e SPRING_PROFILES_ACTIVE=docker